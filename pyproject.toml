[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "RAPID2_Agilent"  # pip install する時の名前
version = "0.1.0"
dependencies = [
    "PyQt6",
    "numpy",
    "lxml",
    "scipy",  # RT alignment of the m/z-RT map's B - A view
]

[tool.hatch.build.targets.wheel]
packages = ["src/RAPID2_Agilent"] # srcの中のどのフォルダをパッケージにするか指定
